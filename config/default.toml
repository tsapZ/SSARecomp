# Codegen fixes for default.xex (Skylanders: Spyro's Adventure, Xbox 360).
# Keys use the same schema as the manifest's [entrypoint] table.
# Every entry (or group of same-reason entries) needs a comment: what's at the address, how it was
# found, and why the fix is safe. Addresses from SwapForceRecomp or GiantsRecomp do NOT apply to
# this XEX.
#
# Entries are added as codegen and the runtime report them.

# 0x829EC1CC is in BinkOpen (sub_829EBEF8, the Bink 1 SDK's: it names "Not a Bink file." at
# 0x8207B08C), right after its read callback filled the 44-byte header at r1+112 and just before
# the signature compares (BIKf..BIKi). Found from that error string's only reference.
# src/hooks/intro_skip_hook.cpp cuts the logo movies (skip_intro, on) and optionally the opening
# movie (skip_opening_movie, off) by setting their frame count to 1; other movies pass unchanged.
[[midasm_hook]]
address = 0x829EC1CC
name = "BinkHeaderLoaded"
registers = ["r1"]

# The scene size hooks (src/hooks/scene_size_hook.cpp, experimental, #30; they do nothing unless
# scene_size is set). The scene's sizes are constants in the code: found by searching the generated
# code for li r5,1120 / li r6,704 and their halves. Safe: each hook changes only registers that hold
# exactly the game's sizes (1120x704, 560x352, 280x176, the 35 x 22 grid), and only with scene_size
# set and the 4096-tile EDRAM in use.
# 0x829611D8 is the start of sub_829611D8, which creates a texture (r3 usage, r4 format, r5 / r6
# width / height, r7 / r8 levels); all scene textures (1120x704, 560x352, 280x176) come from here.
[[midasm_hook]]
address = 0x829611D8
name = "SceneTextureSizeHook"
registers = ["r5", "r6"]

# 0x82929FC8 is bl 0x823b38e0 in sub_82929EE8: a 1120x704 texture header set up directly
# (li r3,1120 / li r4,704 just before), not through sub_829611D8.
[[midasm_hook]]
address = 0x82929FC8
name = "SceneHeaderSizeHook"
registers = ["r3", "r4"]

# 0x828924D8 and 0x828924E0 are stw r11,488(r31) and stw r10,492(r31) in sub_828924B8, which keeps
# the scene size (1120 / 704 in r11 / r10) and a grid of 32-pixel cells (35 columns in r9, 22 rows in
# r8) at +488 .. +500 of its object.
[[midasm_hook]]
address = 0x828924D8
name = "SceneGridSizeHook"
registers = ["r9", "r10", "r11"]

[[midasm_hook]]
address = 0x828924E0
name = "SceneGridRowsHook"
registers = ["r8", "r10"]

# 0x827F5794 is stfs f13,17900(r11) in sub_827F56A0, which keeps the display's aspect ratio (the
# video mode's width over its height, 16:9) at 0x82BB45EC; the cameras take their aspect from it
# through the renderer's state, and the game widens its horizontal FOV with it (Hor+). Found from
# the 16:9 floats in the image's data and the code storing them; poking a 2560x1080 window's
# aspect there in Chapter 1 kept the picture's proportions and showed more at the sides.
# src/hooks/ultrawide_hook.cpp sets f13 to the window's aspect for a window wider than 16:9 with
# ultrawide_fov on; it only changes this one value.
[[midasm_hook]]
address = 0x827F5794
name = "UltrawideAspectHook"
registers = ["f13"]

# 0x829EDEB8 is the start of BinkClose (the Bink SDK's: it stops the movie's sound and frees its
# buffers); its only caller is the game's movie player's close (sub_82852AA8), which clears the
# player's handle at 0x82BB460C right after. With ultrawide active, src/hooks/ultrawide_hook.cpp
# turns the presenter's side bars it put up for the movie (at BinkOpen, see BinkHeaderLoaded)
# off again; it reads and changes no guest state.
[[midasm_hook]]
address = 0x829EDEB8
name = "BinkCloseHook"
registers = []

[functions]
# Function starts the analyzer put one instruction late (SSARecomp #33 / GiantsRecomp #23), found in
# the whole code (a dump of guest memory with the input script's `save`): right after a `blr`, an
# instruction that is no known start, followed by one that is. A function the analyzer reached
# through a branch to its second instruction while its real start is only in a pointer table; such a
# function, when called, ends the game with "Call to invalid or unregistered function". The same
# search found the ones SuperChargersRecomp and ImaginatorsRecomp crashed on at boot, and their
# entries fixed it. A start that was in fact the second half of the function before only splits it,
# which the generated code handles as a tail call. No size given, the analyzer finds the end.
0x8212D87C = {}
0x823EC4EC = {}
0x824D7DE4 = {}
0x8252ADF8 = {}
0x825703B4 = {}
0x825710BC = {}
0x82599F94 = {}
0x825EA6C0 = {}
0x82641160 = {}
0x826F65F4 = {}
0x827FF570 = {}
0x82920A44 = {}
